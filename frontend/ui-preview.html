<!DOCTYPE html>
<html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>BMS UI Preview</title>
<style>
body{margin:0;font-family:Inter,Arial;background:linear-gradient(120deg,#0b1020,#111a31);color:#eef2ff}
.wrap{max-width:1100px;margin:2rem auto;padding:1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem}
.card{background:linear-gradient(160deg,#141c33,#1d2746);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:1rem}
p{color:#aab6df}h1{margin:0}
.value{font-size:1.3rem;color:#fff;font-weight:700}
</style></head>
<body><div class='wrap'><h1>Building Management Command Center</h1><p>Dynamic analytics tiles powered by .NET APIs.</p>
<div class='grid'>
<div class='card'><div>Occupancy</div><div class='value'>142 / 160</div></div>
<div class='card'><div>Open Maintenance</div><div class='value'>17</div></div>
<div class='card'><div>Pending Dues</div><div class='value'>₹ 248,750</div></div>
<div class='card'><div>Active Visitors</div><div class='value'>23</div></div>
<div class='card'><div>Available Parking</div><div class='value'>61</div></div>
</div></div></body></html>
